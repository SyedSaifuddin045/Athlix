services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - coolify
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      DATABASE_HOST: ${DATABASE_HOST:?error}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:?error}
      DATABASE_USER: ${DATABASE_USER:?error}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?error}
      APP_PORT: ${APP_PORT:-8000}
      APP_NAME: ${APP_NAME:-Athlix API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?error}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:?error}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?error}
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOWED_METHODS: '["*"]'
      CORS_ALLOWED_HEADERS: '["*"]'
    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && uv run python -m scripts.seed_exercises_data && uv run uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT:-8000}",
      ]
networks:
  coolify:
    external: true 
