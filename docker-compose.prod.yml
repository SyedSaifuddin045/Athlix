services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - coolify
    ports:
      - "${APP_PORT:-8050}:${APP_PORT:-8050}"
    environment:
      DATABASE_HOST: ${DATABASE_HOST:?error}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:?error}
      DATABASE_USER: ${DATABASE_USER:?error}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?error}
      APP_PORT: ${APP_PORT:-8050}
      APP_NAME: ${APP_NAME:-Athlix API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-false}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?error}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?error}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?error}
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOWED_METHODS: '["*"]'
      CORS_ALLOWED_HEADERS: '["*"]'
      ADMIN_CLERK_IDS: ${ADMIN_CLERK_IDS:-[]}
    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && uv run python -m scripts.seed_exercises_data && uv run uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT:-8050}",
      ]
networks:
  coolify:
    external: true 
